name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: LovMates/Library
          key: Library-Android-${{ hashFiles('LovMates/Assets/**', 'LovMates/Packages/**', 'LovMates/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LovMates
          targetPlatform: Android
          unityVersion: 2022.3.45f1
          buildMethod: LovMates.EditorTools.BuildAndroid.BuildCI

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovMates-APK
          path: LovMates/Builds/LovMates.apk
          if-no-files-found: error
